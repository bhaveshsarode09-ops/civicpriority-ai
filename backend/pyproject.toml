[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpriority"
version = "0.1.0"
description = "CivicPriority AI - From Citizen Voice to Government Action"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["src"]
